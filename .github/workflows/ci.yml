name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lint
        run: swiftlint --strict --reporter github-actions-logging

  test-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Current platform versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run test
        run: swift test

  test-linux:
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "latest"]
        # Dates without a time zone are parsed in the device's time zone
        tz: ["UTC", "America/Los_Angeles", "Pacific/Auckland"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test
        run: |
          swift --version
          swift test
